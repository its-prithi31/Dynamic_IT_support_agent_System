services:
  # FastAPI Backend Web Service
  - type: web
    name: dynamic-it-support-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:///./aegis.db
      - key: JWT_SECRET
        generateValue: true

  # React Vite Frontend Static Site
  - type: static
    name: dynamic-it-support-frontend
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
