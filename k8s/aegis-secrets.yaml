apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis-support
type: Opaque
stringData:
  jwt-secret: "your-production-jwt-secret"
  postgres-password: "your-production-postgres-password"
  database-url: "postgresql+psycopg://aegis:your-production-postgres-password@aegis-postgres:5432/aegis"
