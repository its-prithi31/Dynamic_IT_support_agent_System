services:
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["3000:4173"]
    environment: ["VITE_API_URL=http://localhost:4000/api"]
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-aegis_password}@postgres:5432/aegis
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      CORS_ORIGINS: http://localhost:3000
    depends_on: [postgres, ollama]
  postgres:
    image: postgres:16-alpine
    environment: ["POSTGRES_USER=aegis", "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegis_password}", "POSTGRES_DB=aegis"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
volumes: { postgres_data: {}, ollama_data: {} }
